<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Daddy Ray's Menu</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #061226;
  color: white;
}

.hero {
  text-align: center;
  padding: 30px 15px;
  background: linear-gradient(#061226, #081a3a);
  border-bottom: 5px solid gold;
}

.hero h1 {
  font-size: 48px;
  margin: 0;
}

.hero p {
  color: gold;
  font-weight: bold;
  font-size: 18px;
}

.menu-wrap {
  width: 96%;
  max-width: 1200px;
  margin: 25px auto;
  padding: 8px;
  border-radius: 20px;
  background: linear-gradient(135deg, gold, orange, red, #0b3f91);
  box-shadow: 0 0 35px orange;
}

.menu-board {
  width: 100%;
  display: block;
  border-radius: 15px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  padding: 20px;
}

.buttons a {
  background: gold;
  color: #061226;
  padding: 14px 20px;
  border-radius: 25px;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 0 15px gold;
}

.contact {
  text-align: center;
  padding: 25px;
  margin: 20px;
  border: 3px solid gold;
  border-radius: 20px;
  background: #081a3a;
}

footer {
  text-align: center;
  padding: 20px;
  color: gold;
  font-weight: bold;
}

@media(max-width: 700px) {
  .hero h1 {
    font-size: 36px;
  }

  .menu-wrap {
    width: 100%;
    padding: 0;
    border-radius: 0;
  }

  .menu-board {
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div class="hero">
  <h1>🔥 Chef Daddy Ray's</h1>
  <p>Life is too short for boring food.</p>
</div>

<div class="menu-wrap">
  <img class="menu-board" src="menu.png" alt="Chef Daddy Ray's Menu">
</div>

<div class="buttons">
  <a href="mailto:chefdaddysrays@gmail.com">Email Us</a>
  <a href="#contact">Contact Info</a>
</div>

<div id="contact" class="contact">
  <h2>Book, Follow & Eat</h2>
  <p>Email: chefdaddysrays@gmail.com</p>
  <p>Instagram: @chefdaddyrays</p>
  <p>Facebook: Chef Daddy Ray's</p>
  <p>Las Vegas, Nevada</p>
</div>

<footer>
  © 2026 Chef Daddy Ray's Food Truck
</footer>

</body>
</html>
