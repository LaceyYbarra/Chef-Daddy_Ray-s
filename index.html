<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Daddy Ray's Menu</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(255,120,0,.35), transparent 30%),
    radial-gradient(circle at top right, rgba(0,100,255,.35), transparent 35%),
    linear-gradient(135deg, #020617, #061226 45%, #081a3a);
  color: white;
  text-align: center;
}

.hero {
  padding: 40px;
  border-bottom: 4px solid gold;
}

h1 {
  margin: 0;
  font-size: 50px;
  text-shadow: 0 0 20px orange;
}

.tagline {
  background: white;
  color: #061226;
  display: inline-block;
  margin-top: 15px;
  padding: 12px 20px;
  border-radius: 20px;
  font-weight: bold;
}

.menu-wrap {
  width: 95%;
  max-width: 1100px;
  margin: 25px auto;
  padding: 8px;
  border-radius: 20px;
  background: linear-gradient(135deg, gold, orange, red, #0b3f91);
  box-shadow: 0 0 35px orange;
}

.menu-board {
  width: 100%;
  border-radius: 15px;
}

.contact {
  padding: 25px;
  border-top: 4px solid gold;
}

</style>
</head>

<body>

<div class="hero">
<h1>🔥 Chef Daddy Ray's</h1>
<div class="tagline">Life is too short for boring food.</div>
</div>

<div class="menu-wrap">
<img class="menu-board" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..." />
</div>

<div class="contact">
<h2>Contact</h2>
<p>@chefdaddyrays</p>
<p>Las Vegas, NV</p>
</div>

</body>
</html>
